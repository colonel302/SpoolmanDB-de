name: Build Filaments

on:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - hotfix/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run ID-Tausch-Skript
        run: python scripts/change_id.py

      - name: Finde doppelte IDs und exportiere Mapping
        run: python scripts/find_duplicates.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filaments-artifacts
          path: |
            temp_download/filaments.json
            temp_download/id_mapping.json
            materials.json
            templates/index.html
            templates/styles.css
