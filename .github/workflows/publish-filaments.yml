name: Publish filaments.json via GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run change_id.py to create filaments.json
        run: |
          python scripts/change_id.py

      - name: Prepare publish folder
        run: |
          mkdir -p publish
          cp templates/index.html publish/index.html
          cp templates/styles.css publish/styles.css
          cp temp_download/filaments.json publish/filaments.json
          # Kopiere die Mapping-Datei, falls sie existiert
          if [ -f temp_download/id_mapping.json ]; then cp temp_download/id_mapping.json publish/id_mapping.json; fi
          cp materials.json publish/materials.json

      - name: Commit id_mapping.json to main branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add temp_download/id_mapping.json
          git commit -m "Update id_mapping.json [automated]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
