
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Finden Sie die neuesten Filament- und Materialdaten für den 3D-Druck.">
    <title>SpoolmanDB</title>
    <link rel="stylesheet" href="/SpoolmanDB-de/styles.css">
</head>

<body>
    <header>
        <div class="header-content">
            <picture>
                <img alt="Spoolman Logo"
                    src="https://github.com/Donkie/Spoolman/assets/2332094/4e6e80ac-c7be-4ad2-9a33-dedc1b5ba30e"
                    class="logo">
            </picture>
        </div>
    </header>

    <main>
        <h2>Ein Repository der neuesten Filament- und Materialdaten für den 3D-Druck.</h2>
        <p>Dieses Projekt ist Open-Source. Fühlen Sie sich frei, einen Pull Request zu erstellen <a href="https://github.com/colonel302/SpoolmanDB-de">on Github</a>.</p>
        <h2>Datendateien</h2>
        <div class="data-files">
            <div class="column">
                <ul>
                    <li><a href="materials.json">MATERIALIEN</a></li>
                </ul>
            </div>
            <div class="column">
                <ul>
                    <li><a href="filaments.json">FILAMENTE</a></li>
                </ul>
            </div>
        </div>
    </main>

    <footer>
        <p>SpoolmanDB-de - 2025</p>
    </footer>
	<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('materials.json')
        .then(response => {
            if (!response.ok) throw new Error('materials.json nicht gefunden!');
            return response.json();
        })
        .then(data => {
            // Beispiel: Zeige die Anzahl der Materialien im Footer an
            const footer = document.querySelector('footer');
            if (footer && Array.isArray(data)) {
                const info = document.createElement('div');
                info.style.fontSize = '0.9em';
                info.style.marginTop = '0.5em';
                info.textContent = `Es sind {count} Materialien gelistet.`.replace('{count}', data.length);
                footer.appendChild(info);
            }
            // Hier kannst du weitere Verarbeitung einbauen
            // z.B. dynamische Listen, Tabellen, etc.
        })
        .catch(error => {
            console.error('Fehler beim Laden von materials.json:', error);
        });
});
</script>
</body>

</html>
